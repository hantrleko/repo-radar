name: Radar Scheduled Monitor & Digest

on:
  schedule:
    # 每周一 UTC 02:00 (北京时间 10:00) 自动执行
    - cron: '0 2 * * 1'
  workflow_dispatch: # 支持在 GitHub 页面上随时手动一键触发运行

permissions:
  contents: write
  issues: write

jobs:
  monitor-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Subscription Monitor (云端雷达巡检)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          python -m repo_radar.subscriptions.monitor

      - name: Generate Radar Digest Report (生成最新雷达简报)
        run: |
          python repo_radar/subscriptions/report_generator.py

      - name: Publish to GitHub Actions Summary (直接在页面展示简报)
        run: |
          cat LATEST_RADAR_DIGEST.md >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Updated Digest (自动提交简报回仓库)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST_RADAR_DIGEST.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(radar): update latest radar digest [skip ci]"
            git push
          fi
